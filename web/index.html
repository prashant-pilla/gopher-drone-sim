<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GOPHER Delivery Simulation System</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="image/x-icon" href="favicon.ico">
</head>

<body>
  <div id="delivery-popup" hidden="true">
    <h2>Your delivery is scheduled!</h2>
  </div>
  <div id="notification-bar">
    <ul id="notification-list">
    </ul>
  </div>
  <div id="menu">
    <div>Change View:<br> <select title="Entity Select" id="entity-select">
        <option value="-1">Select entity...</option>
      </select></div>
    <div><br>Simulation Speed:<br> <input title="Speed Slider" type="range" min="1" max="100" value="10" class="slider"
        id="sim-speed">
    </div>
    <div>
      <br><input title="Show Routes" id="show-routes" type="checkbox"> Show All Routes</input>
      <div>
        <button type="button" id="schedule-button">Schedule Trip</button>
        <div id="schedule-input" hidden="true">
          <div>Name: <input id="schedule-name" type="Text" autocomplete="off"></div>
          <div>Search Strategy:
            <select id="search-strategy">
              <option value="astar">Astar</option>
              <option value="bfs">BFS</option>
              <option value="dfs">DFS</option>
              <option value="dijkstra">Dijkstra</option>
            </select>
          </div>
          <div>Shipping Priority:
            <select id="shipping-priority">
              <option value="Standard">Standard</option>
              <option value="NoRush">No Rush</option>
              <option value="Expedited">Expedited</option>
            </select>
          </div>
          <br><button id="schedule-submit">Submit</button>
          <button id="schedule-cancel">Cancel</button><br>
          <div id="schedule-error"></div>
        </div>
        <div>
          <button type="button" id="add-human">Add Human</button><br>
          <button type="button" id="add-drone">Add Drone</button><br>
          <button type="button" id="change-priority">Manage Priorities</button>
          <div id="change-priority-input" hidden="true">
            <div>Package Name: <input id="change-priority-name" type="Text" autocomplete="off"></div>
            <div>New Priority:
              <select id="change-priority-value">
                <option value="Standard">Standard</option>
                <option value="NoRush">No Rush</option>
                <option value="Expedited">Expedited</option>
              </select>
            </div>
            <div id="priority-queue-info">
              <h4>Current Queue (Priority Order):</h4>
              <ul id="priority-queue-list">
                <!-- Package list will be populated here -->
              </ul>
            </div>
            <br><button id="change-priority-submit">Update Priority</button>
            <button id="refresh-packages">Refresh List</button>
            <button id="change-priority-cancel">Close</button><br>
            <div id="change-priority-error"></div>
          </div>
          <button type="button" id="stop-simulation">Stop Simulation</button>
        </div>
      </div>
    </div>
  </div>
  <div id="scene-container"></div>
  <!-- Include the "main" graphics script and run it. -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
